<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetSaaS — prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F3;--surface:#fff;--ink:#1B2A26;--ink-2:#4B5A55;--ink-3:#8A9793;--line:#DCE4E0;--green:#0F6E56;--green-deep:#0B4F3E;--green-soft:#D9EFE6;--honey:#E0A526;--honey-deep:#B7801A;--honey-soft:#FBF1D6;--red:#C2412D;--red-soft:#F8E1DC;--slate:#4A6C8C;--slate-soft:#DFE8F0;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
.muted{color:var(--ink-2)}.small{font-size:12px}.faint{color:var(--ink-3)}
.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--green);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.honey{background:var(--honey);color:var(--ink)}.btn.danger{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}.btn.xs{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--green);font-weight:600;background:none;border:0;padding:0}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--green-soft);color:var(--green)}
.tag.honey{background:var(--honey-soft);color:var(--honey-deep)}.tag.red{background:var(--red-soft);color:var(--red)}.tag.slate{background:var(--slate-soft);color:var(--slate)}.tag.grey{background:#E9EEEB;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:600;font-size:13px}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:12px}.row>*{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px}
.panel-b{padding:14px 18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F7FAF8}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--red)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 30px 80px rgba(27,42,38,.35)}
dialog::backdrop{background:rgba(27,42,38,.45)}
dialog .dh{padding:18px 22px 10px}dialog .dh h3{font-size:19px}
dialog .db{padding:6px 22px 22px}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px}
.bar{height:6px;background:#E6ECE9;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.bar i.warn{background:var(--honey)}.bar i.over{background:var(--red)}

/* Mode switcher */
.modebar{position:fixed;top:0;left:0;right:0;height:38px;background:var(--ink);color:#C9E0D6;display:flex;align-items:center;gap:6px;padding:0 14px;z-index:50;font-size:13px}
.modebar b{color:#fff;margin-right:8px;font-family:var(--display)}
.modebar button{background:transparent;border:1px solid rgba(255,255,255,.15);color:#C9E0D6;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600}
.modebar button.on{background:var(--honey);color:var(--ink);border-color:var(--honey)}
.modebar .sp{flex:1}
#root{padding-top:38px}

/* Public */
.pub{min-height:calc(100vh - 38px);display:grid;place-items:center;padding:30px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(460px,100%)}
.card h1{font-size:26px;margin-bottom:4px}
.landing{max-width:980px;margin:0 auto;padding:60px 20px}
.landing h1{font-size:44px;line-height:1.05;max-width:640px}
.landing p.lead{font-size:18px;color:var(--ink-2);max-width:560px;margin:16px 0 26px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:40px}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.plan h3{font-size:18px}.plan .p{font-family:var(--display);font-size:28px;font-weight:600;margin:6px 0 10px}.plan .p span{font-size:13px;font-family:var(--body);font-weight:500;color:var(--ink-2)}
.plan ul{padding-left:18px;color:var(--ink-2);font-size:13px;line-height:1.7}
.plan.cur{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* App shell */
.app{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 38px)}
.side{background:var(--green-deep);color:#E6F2ED;padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:38px;height:calc(100vh - 38px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--honey);display:grid;place-items:center;color:var(--green-deep);font-family:var(--display);font-weight:700;font-size:14px;flex:none}
.brand h1{font-size:14px;line-height:1.15;color:#fff}.brand small{display:block;font-size:12px;color:#9FC7B8;font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#C9E0D6;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--honey)}
.nav a.lock{opacity:.5}
.nav .pill{font-size:11px;background:var(--honey);color:var(--green-deep);border-radius:999px;padding:1px 7px;font-weight:600}
.side .planbox{margin-top:auto;background:rgba(255,255,255,.08);border-radius:10px;padding:12px;font-size:12px;color:#9FC7B8}
.side .planbox strong{display:block;color:#fff;font-size:13px;margin-bottom:6px}
.side .planbox .bar{background:rgba(255,255,255,.15);margin:6px 0 4px}.side .planbox .bar i{background:var(--honey)}
.side .planbox a{display:inline-block;margin-top:8px;color:#fff;font-weight:600;font-size:13px;border-bottom:1px solid rgba(255,255,255,.4)}
.main{padding:24px 30px 60px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top h2{font-size:26px}.top p{color:var(--ink-2);margin-top:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;min-width:260px}
.figures{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fig{padding:14px 18px;border-right:1px solid var(--line)}.fig:last-child{border-right:0}
.fig .v{font-family:var(--display);font-size:24px;font-weight:600;line-height:1}.fig .l{color:var(--ink-2);margin-top:5px}.fig .d{font-size:12px;margin-top:3px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs button{background:none;border:0;padding:12px 12px 10px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--honey)}
.alertbox{background:var(--honey-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.alertbox.red{background:var(--red-soft)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--ink-2);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.audit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.cart{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}
.tot.big{font-family:var(--display);font-size:20px;font-weight:600}
.lock{background:var(--honey-soft);border-radius:14px;padding:24px;text-align:center}
.lock h3{font-size:20px;margin-bottom:6px}

/* PWA */
.pwa-wrap{min-height:calc(100vh - 38px);display:grid;place-items:center;background:#D7DEDA;padding:20px}
.phone{width:390px;height:800px;background:#fff;border-radius:40px;box-shadow:0 30px 80px rgba(27,42,38,.35),0 0 0 10px #1B2A26;overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:15px}
.phone .status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:13px;font-weight:600}
.screen{flex:1;overflow-y:auto;padding:0 0 96px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
.pw{padding:14px 20px 0}
.hero{padding:18px 20px 4px;display:flex;gap:14px;align-items:center}
.avatar{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3CD73,#C98A1F);display:grid;place-items:center;color:var(--green-deep);font-family:var(--display);font-size:28px;font-weight:700;flex:none}
.hero h1{font-size:30px;line-height:1}.hero p{color:var(--ink-2);margin-top:4px;font-size:14px}
.next{margin:14px 20px 0;background:var(--honey-soft);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--honey);opacity:.18}
.next small{color:var(--honey-deep);font-weight:600}.next h2{font-size:21px;margin-top:3px}
.next .when{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;margin-top:8px}.next .when span{font-family:var(--body);font-size:14px;font-weight:500;color:var(--ink-2);margin-left:6px}
.next.ok{background:var(--green-soft)}.next.ok small{color:var(--green)}
.next.late{background:var(--red-soft)}.next.late small{color:var(--red)}
.sect{padding:22px 20px 0}.sect h3{font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.prot{margin-top:8px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pr{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.pr:last-child{border-bottom:0}
.pr i{width:11px;height:11px;border-radius:50%}.pr i.ok{background:var(--green)}.pr i.soon{background:var(--honey)}.pr i.late{background:var(--red)}
.pr b{font-weight:600;display:block;font-size:14px}.pr span{font-size:12px;color:var(--ink-2)}
.pr .st{font-size:12px;font-weight:600}.pr .st.ok{color:var(--green)}.pr .st.soon{color:var(--honey-deep)}.pr .st.late{color:var(--red)}
.log{margin-top:8px;position:relative;padding-left:20px}.log::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line)}
.li{position:relative;padding:0 0 16px}.li::before{content:"";position:absolute;left:-20px;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.li .d{font-size:12px;color:var(--ink-3)}.li b{display:block;font-weight:600;font-size:14px}.li span{font-size:12px;color:var(--ink-2)}
.pets{display:flex;gap:8px;padding:12px 20px 0;overflow-x:auto}.pets button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:500;color:var(--ink-2);white-space:nowrap;font-size:13px}.pets button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 18px}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}.tabbar button.on{color:var(--green)}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}.notif b{display:block;font-size:14px}.notif span{font-size:12px;color:var(--ink-2)}.notif.unread{border-color:var(--honey);background:var(--honey-soft)}
.cita{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cita b{display:block;font-size:14px}.cita span{font-size:12px;color:var(--ink-2)}
.pwaform{padding:30px 22px}.pwaform h1{font-size:26px}.pwaform p{color:var(--ink-2);margin:8px 0 16px}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.nav{flex-direction:row;flex-wrap:wrap}.side .planbox{display:none}.main{padding:16px}.figures{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.phone{width:100%;height:calc(100vh - 38px);border-radius:0;box-shadow:none}.pwa-wrap{padding:0}}

/* Mascota animada */
.mood{margin:12px 20px 0;border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;border:1px solid var(--line)}
.mood.bien{background:var(--green-soft);border-color:transparent}.mood.atencion{background:var(--honey-soft);border-color:transparent}.mood.hosp{background:var(--slate-soft);border-color:transparent}.mood.recup{background:#EEF3E4;border-color:transparent}
.mood b{display:block;font-family:var(--display);font-size:17px}.mood span{font-size:13px;color:var(--ink-2)}
.mood video,.mood img.anim{width:96px;height:96px;border-radius:14px;object-fit:cover;background:#fff}
.pet{width:96px;height:96px;display:block}
@media(prefers-reduced-motion:no-preference){
  .pet .tail{transform-origin:left center;animation:wag .5s ease-in-out infinite alternate}
  .pet.bien .body{animation:breathe 2.4s ease-in-out infinite}
  .pet.hosp .body{animation:breathe 4s ease-in-out infinite}
  .pet.hosp .zz{animation:zz 2.4s ease-in-out infinite;opacity:0}
  .pet.hosp .zz:nth-child(2){animation-delay:.8s}.pet.hosp .zz:nth-child(3){animation-delay:1.6s}
  .pet.atencion .head{transform-origin:center 60%;animation:tilt 1.6s ease-in-out infinite alternate}
  .pet.atencion .alert{animation:pulse 1s ease-in-out infinite}
  .pet.recup .body{animation:breathe 3s ease-in-out infinite}.pet.recup .tail{animation-duration:.9s}
  .pet .ear{transform-origin:top center;animation:earflick 5s ease-in-out infinite}
}
@keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.04)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes tilt{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes earflick{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-14deg)}96%{transform:rotate(6deg)}}
/* Fotos */
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.fotos .add{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--ink-3);font-size:12px;font-weight:600;cursor:pointer;text-align:center;padding:6px}
.fotos .add:hover{border-color:var(--green);color:var(--green)}
.avatar.photo{background:none;overflow:hidden}.avatar.photo img{width:100%;height:100%;object-fit:cover}
/* Hospitalización */
.jaulas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.jaula{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:86px;background:#fff}
.jaula.libre{border-style:dashed;color:var(--ink-3);display:grid;place-items:center;font-size:13px}
.jaula.ocupada{border-left:4px solid var(--slate);cursor:pointer}.jaula.ocupada.alerta{border-left-color:var(--red)}
.jaula b{display:block}.jaula small{color:var(--ink-2);display:block}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.vit div{background:var(--bg);border-radius:10px;padding:8px 10px}.vit b{font-family:var(--display);font-size:18px;display:block}.vit span{font-size:11px;color:var(--ink-2)}
.vit .bad b{color:var(--red)}
.evol{border-left:2px solid var(--line);padding-left:12px;margin-top:8px}.evol div{padding:6px 0;font-size:13px}.evol .small{color:var(--ink-3)}
</style>
</head>
<body>
<div class="modebar">
  <b>VetSaaS</b>
  <button data-mode="pub">Web pública</button>
  <button data-mode="panel">Panel de clínica</button>
  <button data-mode="pwa">PWA del tutor</button>
  <span class="sp"></span>
  <span class="small">Prototipo funcional en memoria: al recargar la página se reinicia con los datos de ejemplo.</span>
</div>
<div id="root"></div>
<dialog id="dlg"></dialog>
<script>
/* =========================== ESTADO Y DATOS =========================== */
const TODAY = new Date('2026-09-02T10:42:00');
const D = (offsetDays, h=9, m=0) => { const d=new Date(TODAY); d.setDate(d.getDate()+offsetDays); d.setHours(h,m,0,0); return d.toISOString(); };
let _id = 100; const uid = p => `${p}_${++_id}`;

const PLANS = {
  gratis:  { nombre:'Gratis',  precio:0,   usuarios:1,  sms:50,   wa:0,    sunat:false, modulos:['hoy','agenda','pacientes','tutores','mensajes','config','miplan'], mensajeria:'fijo' },
  basico:  { nombre:'Básico',  precio:59,  usuarios:2,  sms:300,  wa:300,  sunat:true,  modulos:['hoy','agenda','pacientes','tutores','caja','inventario','mensajes','reportes','auditoria','config','miplan'], mensajeria:'configurable' },
  pro:     { nombre:'Pro',     precio:99,  usuarios:5,  sms:1000, wa:1000, sunat:true,  modulos:['hoy','agenda','pacientes','tutores','caja','inventario','hospitalizacion','mensajes','reportes','auditoria','config','miplan'], mensajeria:'configurable' },
  clinica: { nombre:'Clínica', precio:169, usuarios:Infinity, sms:3000, wa:3000, sunat:true, modulos:['hoy','agenda','pacientes','tutores','caja','inventario','hospitalizacion','mensajes','reportes','auditoria','config','miplan'], mensajeria:'completo' },
};
const MODULOS = [['hoy','Hoy'],['agenda','Agenda'],['pacientes','Pacientes'],['tutores','Tutores'],['caja','Caja y comprobantes'],['inventario','Inventario'],['hospitalizacion','Hospitalización'],['mensajes','Mensajes'],['reportes','Reportes'],['auditoria','Auditoría'],['config','Configuración'],['miplan','Mi plan']];

// Esquemas: intervalo en días para la próxima dosis
const ESQUEMA = { 'Séxtuple':365, 'Antirrábica':365, 'Triple felina':365, 'Desparasitación interna':90, 'Antipulgas':90, 'Leucemia felina':365 };

// Plantillas globales (Superadmin) — las del plan Gratis no se editan

const fmtDate = iso => new Date(iso).toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'});

const fmtTime = iso => new Date(iso).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
const fmtMoney = n => 'S/ ' + n.toFixed(2).replace('.',',');
const daysUntil = iso => Math.round((new Date(iso) - TODAY)/86400000);
const addDays = (iso,n) => { const d=new Date(iso); d.setDate(d.getDate()+n); return d.toISOString(); };
const sameDay = (a,b) => new Date(a).toDateString()===new Date(b).toDateString();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Estado de protección por tipo de vacuna para un paciente
function proteccion(pid){
  const tipos = {}; T('vacunaciones').filter(v=>v.pacienteId===pid).forEach(v=>{ if(!tipos[v.tipo]||new Date(v.fecha)>new Date(tipos[v.tipo].fecha)) tipos[v.tipo]=v; });
  return Object.values(tipos).map(v=>{ const prox=addDays(v.fecha,v.proximaDias); const d=daysUntil(prox); return {tipo:v.tipo,ultima:v.fecha,proxima:prox,dias:d,estado:d<0?'late':d<=30?'soon':'ok'}; }).sort((a,b)=>a.dias-b.dias);
}
function ultimoPeso(pid){ return S.pesos.filter(p=>p.pacienteId===pid).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]; }
function stock(pid){ return T('lotes').filter(l=>l.productoId===pid).reduce((a,l)=>a+l.cantidad,0); }
// Salida FEFO: descuenta del lote que vence primero
function descontarStock(productoId,cant){ const lotes=T('lotes').filter(l=>l.productoId===productoId&&l.cantidad>0).sort((a,b)=>new Date(a.vence)-new Date(b.vence)); let rest=cant; for(const l of lotes){ if(rest<=0)break; const q=Math.min(l.cantidad,rest); l.cantidad-=q; rest-=q; } return rest===0; }
function usuariosActivos(){ return T('usuarios').filter(u=>u.activo).length; }
function moduloPermitido(m){ return plan().modulos.includes(m); }

// Emisión de comprobante: serie/correlativo atómico, IGV, cola OSE simulada
function emitirComprobante({tipo,tutorId,doc,items,medio}){
  const t=tenant(); const p=plan();
  if(tipo!=='T' && !p.sunat) return {error:'Tu plan no incluye facturación electrónica SUNAT. Sube a Básico en Mi plan.'};
  if(tipo==='F' && !/^\d{11}$/.test(doc)) return {error:'Para factura se necesita un RUC válido de 11 dígitos.'};
  const s=T('series').find(x=>x.tipo===tipo); s.correlativo++;
  const numero=`${s.serie}-${String(s.correlativo).padStart(5,'0')}`;
  const total=items.reduce((a,i)=>a+i.cant*i.precio,0);
  const cp={id:uid('cp'),tenantId:t.id,tipo,numero,fecha:new Date().toISOString(),tutorId,doc,items,total,base:+(total/1.18).toFixed(2),igv:+(total-total/1.18).toFixed(2),estado:tipo==='T'?'interno':'pendiente',medio};
  S.comprobantes.unshift(cp);
  items.forEach(i=>{ if(i.productoId) descontarStock(i.productoId,i.cant); });
  log('Comprobante emitido',`${numero} ${fmtMoney(total)}`);
  if(tipo!=='T'){ // simulación de respuesta del OSE
    setTimeout(()=>{ const ok = tipo==='F' || /^\d{8}$/.test(doc) || doc===''; cp.estado = ok?'aceptado':'observado'; if(!ok) cp.motivo='DNI inválido'; log('Respuesta OSE',`${numero} ${cp.estado}`); render(); toast(`${numero} ${ok?'aceptado por SUNAT':'observado por SUNAT'}`,!ok); },2200);
  }
  return {cp};
}

// Motor de recordatorios: escalera push → SMS → (WhatsApp) con cupos y modo por plan
function generarRecordatorios(){
  const t=tenant(), p=plan(), modo=p.mensajeria; let creados=0, omitidos=[];
  const plantillas = modo==='fijo' ? S.superadmin.plantillas : S.plantillasTenant[t.id];
  const eventos = modo==='fijo' ? {vacuna:{activo:true,dias:[7,1]},cita:{activo:true,dias:[1]}} : S.eventosTenant[t.id];
  const ya = (tutorId,pid,evento,ref) => T('notificaciones').some(n=>n.tutorId===tutorId&&n.pacienteId===pid&&n.evento===evento&&n.ref===ref);
  const enviar = (tutor,pac,evento,ref,vars,critico=false) => {
    if(ya(tutor.id,pac.id,evento,ref)) return;
    if(pac.estado!=='activo') return;
    const texto = plantillas[evento].replace(/\{(\w+)\}/g,(_,k)=>vars[k]??'');
    const n={id:uid('n'),tenantId:t.id,tutorId:tutor.id,pacienteId:pac.id,evento,ref,fecha:new Date().toISOString(),texto,leida:false};
    if(tutor.vinculado&&tutor.pushToken){ Object.assign(n,{canal:'push',estado:'entregado',costo:0}); t.pushEnviados++; }
    else if(t.smsUsados<p.sms){ const gw=S.superadmin.gateways.find(g=>g.activo&&g.hoy<g.limite); if(gw){ gw.hoy++; t.smsUsados++; Object.assign(n,{canal:'sms',estado:'enviado',costo:0.008,gateway:gw.nombre}); } else { Object.assign(n,{canal:'sms',estado:'fallido',costo:0,error:'Sin gateway con capacidad'}); } }
    else if(critico&&p.wa>0&&t.waUsados<p.wa){ t.waUsados++; Object.assign(n,{canal:'whatsapp',estado:'enviado',costo:0.03}); }
    else { Object.assign(n,{canal:'ninguno',estado:'fallido',costo:0,error:'Sin push y cupo SMS agotado'}); omitidos.push(pac.nombre); }
    S.notificaciones.unshift(n); creados++;
  };
  // Vacunas por vencer
  if(eventos.vacuna?.activo) T('pacientes').forEach(pac=>{ const tut=by('tutores',pac.tutorId); proteccion(pac.id).forEach(pr=>{ if(eventos.vacuna.dias.includes(pr.dias)||(pr.dias>=0&&pr.dias<=7&&eventos.vacuna.dias.includes(7))) enviar(tut,pac,pr.tipo.includes('Desparasit')?(eventos.desparasitacion?.activo?'desparasitacion':null):'vacuna',pr.proxima.slice(0,10),{mascota:pac.nombre,vacuna:pr.tipo,fecha:fmtDate(pr.proxima),clinica:t.nombre}); }); });
  // Citas de mañana
  if(eventos.cita?.activo) T('citas').filter(c=>daysUntil(c.fecha)===1&&['reservada','confirmada'].includes(c.estado)).forEach(c=>{ const pac=by('pacientes',c.pacienteId), tut=by('tutores',pac.tutorId); enviar(tut,pac,'cita',c.id,{mascota:pac.nombre,fecha:fmtDate(c.fecha),hora:fmtTime(c.fecha),clinica:t.nombre},true); });
  log('Scheduler de recordatorios',`${creados} generados`);
  return {creados,omitidos};
}


/* =========================== ESTADO Y ANIMACIÓN DE LA MASCOTA =========================== */
// Estado actual: hospitalizado > recuperando (alta < 7 días) > atención (protección vencida) > bien
function estadoMascota(p){
  const h=S.internamientos.find(x=>x.pacienteId===p.id&&!x.alta); if(h) return {k:'hosp',t:'Hospitalizado',d:`En ${h.jaula} desde ${fmtTime(h.ingreso)}. ${h.evolucion.at(-1)?.texto||''}`};
  const alta=S.internamientos.filter(x=>x.pacienteId===p.id&&x.alta&&daysUntil(x.alta)>=-7).at(-1); if(alta) return {k:'recup',t:'Recuperándose',d:`Alta el ${fmtDate(alta.alta)}. ${alta.informeAlta||'Sigue las indicaciones de la clínica.'}`};
  const late=proteccion(p.id).filter(x=>x.estado==='late'); if(late.length) return {k:'atencion',t:'Necesita atención',d:`${late.map(x=>x.tipo).join(' y ')} vencida${late.length>1?'s':''}.`};
  return {k:'bien',t:'Está bien',d:'Vacunas al día. Nada pendiente.'};
}

/* =========================== PANEL: HOSPITALIZACIÓN =========================== */
function pHosp(){
  const t=tenant(); const jaulas=S.jaulasTenant[t.id]||(S.jaulasTenant[t.id]=['J-1','J-2','J-3','G-1']);
  const act=T('internamientos').filter(h=>!h.alta); const sel=S.sub.hospId&&act.find(h=>h.id===S.sub.hospId);
  const vencidas=h=>h.tareas.filter(x=>!x.hecha&&x.hora<=fmtTime(new Date().toISOString())).length;
  const tablero=`<section class="panel"><div class="panel-h"><h3>Jaulas y áreas</h3><span class="small faint">${act.length} de ${jaulas.length} ocupadas</span></div><div class="panel-b"><div class="jaulas">${jaulas.map(j=>{const h=act.find(x=>x.jaula===j); if(!h) return `<div class="jaula libre">${j} libre</div>`; const p=by('pacientes',h.pacienteId); const v=h.signos.at(-1); return `<div class="jaula ocupada ${vencidas(h)?'alerta':''}" data-act="hospSel" data-id="${h.id}"><small>${j}</small><b>${esc(p.nombre)}</b><small>${esc(h.motivo)}</small><small>${v?`T ${v.temp}°, FC ${v.fc}`:'sin signos'}</small>${vencidas(h)?`<span class="tag red" style="margin-top:4px">${vencidas(h)} tarea${vencidas(h)>1?'s':''} atrasada${vencidas(h)>1?'s':''}</span>`:''}</div>`;}).join('')}</div></div></section>`;
  let detalle='';
  if(sel){ const h=sel, p=by('pacientes',h.pacienteId), tu=by('tutores',p.tutorId); const v=h.signos.at(-1); const consumo=h.consumos.reduce((a,c)=>a+c.cant*c.precio,0); const pend=h.tareas.filter(x=>!x.hecha).length;
    const rango={temp:[37.5,39.5],fc:p.especie==='Felino'?[120,200]:[60,140],fr:[15,35]};
    const bad=(k,val)=>val<rango[k][0]||val>rango[k][1]?'bad':'';
    detalle=`<section class="panel"><div class="panel-h"><div><h3>${esc(p.nombre)} <span class="tag slate">${h.jaula}</span> <span class="muted small">${p.especie}, ${esc(p.raza)}, ${ultimoPeso(p.id)?.kg||'?'} kg</span></h3><span class="small faint">Ingresó ${fmtDate(h.ingreso)} ${fmtTime(h.ingreso)}. ${esc(by('usuarios',h.vetId)?.nombre||'')}. Tutor ${esc(tu.nombre)} ${tu.vinculado?'<span class="tag">App</span>':''}</span></div><div class="tools"><button class="btn sm ghost" data-act="hospSignos" data-h="${h.id}">Signos vitales</button><button class="btn sm ghost" data-act="hospNota" data-h="${h.id}">Nota de evolución</button><button class="btn sm ghost" data-act="hospConsumo" data-h="${h.id}">Consumo</button><button class="btn sm ghost" data-act="agregarTarea" data-h="${h.id}">Tarea</button><button class="btn sm" data-act="hospAlta" data-h="${h.id}" ${pend?'disabled title="Hay tareas pendientes"':''}>Dar de alta</button></div></div>
    <div class="panel-b"><div class="grid3">
      <div><b>Signos vitales</b>${v?`<div class="vit"><div class="${bad('temp',v.temp)}"><b class="num">${v.temp}°</b><span>Temperatura</span></div><div class="${bad('fc',v.fc)}"><b class="num">${v.fc}</b><span>FC</span></div><div class="${bad('fr',v.fr)}"><b class="num">${v.fr}</b><span>FR</span></div><div class="${v.dolor>=5?'bad':''}"><b class="num">${v.dolor}/10</b><span>Dolor</span></div></div><p class="small faint">Último ${fmtTime(v.fecha)}. ${h.signos.length} registros. Fuera de rango en rojo.</p>`:'<p class="small muted">Sin registros.</p>'}
        <b style="display:block;margin-top:10px">Hoja de tratamiento</b>${h.tareas.sort((a,b)=>a.hora.localeCompare(b.hora)).map(x=>`<label style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;${x.hecha?'opacity:.5;text-decoration:line-through':''}"><input type="checkbox" ${x.hecha?'checked disabled':''} data-act="tareaHecha" data-h="${h.id}" data-hora="${x.hora}"> <b class="num">${x.hora}</b> ${esc(x.desc)}${x.hechaPor?`<span class="faint">, ${esc(x.hechaPor)}</span>`:''}</label>`).join('')||'<p class="small muted">Sin tareas.</p>'}</div>
      <div><b>Evolución</b><div class="evol">${h.evolucion.slice().reverse().map(e=>`<div><span class="small">${fmtDate(e.fecha)} ${fmtTime(e.fecha)}, ${esc(e.autor)}</span><br>${esc(e.texto)}${e.enviadoTutor?' <span class="tag" style="font-size:11px">Enviado al tutor</span>':''}</div>`).join('')||'<div class="small muted">Sin notas.</div>'}</div><p class="small muted" style="margin-top:8px">Motivo: ${esc(h.motivo)}. Dx: ${esc(h.diagnostico||'')}</p></div>

function mCambiarPlan(k){
  const t=tenant(), np=PLANS[k], subir=np.precio>plan().precio;
  if(!subir){ if(usuariosActivos()>np.usuarios) return toast(`Tienes ${usuariosActivos()} usuarios activos y ${np.nombre} permite ${np.usuarios}. Desactiva usuarios primero.`,true);
    return modal(`Bajar a ${np.nombre}`,`<p>El cambio se aplica al final del periodo pagado (1 de octubre). Los módulos que no incluye ${np.nombre} quedarán en solo lectura; no se borra nada.</p>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn danger" data-act="confirmarPlan" data-plan="${k}">Programar cambio</button>`); }
  const dif=np.precio-plan().precio; const prorr=(dif*28/30).toFixed(2);
  modal(`Subir a ${np.nombre}`,`<div class="tot"><span>Prorrateo por 28 días restantes</span><b class="num">S/ ${prorr}</b></div><div class="tot"><span>Luego, cada mes</span><b class="num">S/ ${np.precio}</b></div>${t.tarjeta?`<p style="margin-top:12px">Se cobrará a la tarjeta •••• ${t.tarjeta}.</p>`:`<div class="row" style="margin-top:12px"><div class="field"><label>Tarjeta (formulario de la pasarela, simulado)</label><input id="pl_card" placeholder="4111 1111 1111 1111"></div><div class="field"><label>Vence</label><input placeholder="12/28"></div><div class="field"><label>CVV</label><input placeholder="•••" type="password"></div></div><p class="small faint">En producción este formulario lo renderiza la pasarela; el sistema solo recibe un token.</p>`}`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="confirmarPlan" data-plan="${k}">Pagar y activar</button>`);
}

/* =========================== CARNET ELECTRÓNICO (compartido panel/PWA) =========================== */
function carnetHTML(p,enPanel=false){
  const pr=proteccion(p.id); const next=pr.find(x=>x.estado!=='late')||pr[0]; const late=pr.filter(x=>x.estado==='late');
  const pesos=S.pesos.filter(x=>x.pacienteId===p.id).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)); const w=pesos[pesos.length-1], w0=pesos[pesos.length-2];
  const pts=pesos.length>1?pesos.map((x,i)=>{const min=Math.min(...pesos.map(z=>z.kg)),max=Math.max(...pesos.map(z=>z.kg));return `${i/(pesos.length-1)*150},${max===min?28:50-(x.kg-min)/(max-min)*44}`;}).join(' '):'';
  const vacs=T('vacunaciones').filter(v=>v.pacienteId===p.id).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const nextBlock = late.length ? `<section class="next late"><small>Vencida</small><h2>${esc(late[0].tipo)}</h2><div class="when num">${-late[0].dias} días<span>tocaba el ${fmtDate(late[0].proxima)}</span></div>${enPanel?'':`<div class="tools" style="margin-top:12px"><button class="btn" data-act="pwaReservar" data-tipo="${esc(late[0].tipo)}">Reservar cita</button></div>`}</section>`
    : next ? `<section class="next ${next.estado==='ok'?'ok':''}"><small>${next.estado==='ok'?'Todo al día. Próxima':'Próxima vacuna'}</small><h2>${esc(next.tipo)}</h2><div class="when num">${next.dias} días<span>vence el ${fmtDate(next.proxima)}</span></div>${enPanel?'':`<div class="tools" style="margin-top:12px"><button class="btn" data-act="pwaReservar" data-tipo="${esc(next.tipo)}">Reservar cita</button></div>`}</section>`
    : `<section class="next"><small>Sin vacunas registradas</small><h2>Agenda su primera vacuna</h2></section>`;
  const foto=fotoPrincipal(p);
  return `<div class="hero"><div class="avatar ${foto?'photo':''}">${foto?`<img src="${foto}" alt="">`:esc(p.nombre[0])}</div><div><h1>${esc(p.nombre)}</h1><p>${esc(p.raza)}, ${p.sexo==='M'?'macho':'hembra'}, ${edad(p.nacimiento)}</p>${p.microchip?'<span class="tag" style="margin-top:6px">Microchip registrado</span>':''}${p.alergias?`<span class="tag red" style="margin-top:6px">Alergia: ${esc(p.alergias)}</span>`:''}</div></div>
  ${mascotaAnim(p)}
  ${nextBlock}
  ${enPanel?'':`<section class="sect"><h3>Fotos <span class="small faint" style="font-family:var(--body);font-weight:500">${(p.fotos||[]).length} de 6</span></h3><div class="fotos">${(p.fotos||[]).map((f,i)=>`<img src="${f}" alt="Foto de ${esc(p.nombre)}" data-act="pwaFotoPrincipal" data-i="${i}" title="Tocar para usar como principal">`).join('')}${(p.fotos||[]).length<6?`<label class="add">Subir foto<input type="file" accept="image/*" capture="environment" hidden data-act="pwaFoto" data-id="${p.id}"></label>`:''}</div><p class="small faint" style="margin-top:6px">Se guardan en tu cuenta y la clínica las ve en la ficha. Máximo 6, se comprimen a 800 px.</p></section>`}
  <section class="sect"><h3>Protección</h3><div class="prot">${pr.map(x=>`<div class="pr"><i class="${x.estado}"></i><div><b>${esc(x.tipo)}</b><span>${x.estado==='late'?'Tocaba el '+fmtDate(x.proxima):x.estado==='soon'?'Última: '+fmtDate(x.ultima):'Al día hasta '+fmtDate(x.proxima)}</span></div><div class="st ${x.estado}">${{ok:'Al día',soon:'Próxima',late:'Vencida'}[x.estado]}</div></div>`).join('')||'<div class="empty">Sin registros.</div>'}</div></section>

/* =========================== PWA DEL TUTOR =========================== */
function vPWA(){
  const tut=S.pwa.tutorId&&S.tutores.find(t=>t.id===S.pwa.tutorId);
  let screen;
  if(!tut) screen=`<div class="pwaform"><h1>Vincula tu mascota</h1><p>Escanea el QR de tu boleta o carnet. En este prototipo, pega el token que genera la clínica en Tutores, o usa uno de prueba.</p><div class="field"><label>Token del QR</label><input id="pw_token" placeholder="Pega aquí el token"></div><button class="btn" style="width:100%;justify-content:center" data-act="pwaVincular">Vincular</button><p class="small faint" style="margin-top:14px">Tutores de prueba ya vinculados:</p><div class="chips" style="margin-top:6px">${S.tutores.filter(t=>t.vinculado).map(t=>`<button class="chip" data-act="pwaEntrar" data-id="${t.id}">${esc(t.nombre)}</button>`).join('')}</div></div>`;
  else {
    const t=S.tenants.find(x=>x.id===tut.tenantId); const mascotas=S.pacientes.filter(p=>p.tutorId===tut.id);
    S.pwa.pacienteId = mascotas.find(p=>p.id===S.pwa.pacienteId)?.id || mascotas[0]?.id;
    const p=mascotas.find(x=>x.id===S.pwa.pacienteId);
    const nots=S.notificaciones.filter(n=>n.tutorId===tut.id&&n.canal==='push').sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)); const unread=nots.filter(n=>!n.leida).length;
    const citas=S.citas.filter(c=>mascotas.some(m=>m.id===c.pacienteId)&&daysUntil(c.fecha)>=0&&!['cancelada','atendida','no_asistio'].includes(c.estado)).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
    const tab=S.pwa.tab; let inner='';
    if(tab==='mascotas'){ // scope de acceso: el tutor solo ve sus mascotas
      S.session||(S.session={tenantId:tut.tenantId}); // contexto de tenant para helpers
      inner=`<div class="pets">${mascotas.map(m=>`<button class="${m.id===p?.id?'on':''}" data-act="pwaPet" data-id="${m.id}">${esc(m.nombre)}</button>`).join('')}</div>${p?carnetHTML(p):'<div class="empty">Sin mascotas vinculadas.</div>'}`; }
    if(tab==='citas') inner=`<div class="pw"><h1 style="font-size:24px">Citas</h1>${citas.map(c=>`<div class="cita"><div><b>${esc(by('pacientes',c.pacienteId).nombre)}: ${esc(by('servicios',c.servicioId)?.nombre||c.motivo)}</b><span>${fmtDay(c.fecha)}, ${fmtTime(c.fecha)}. ${ESTADO_CITA[c.estado][0]}</span></div><div style="display:flex;flex-direction:column;gap:4px">${c.estado==='reservada'?`<button class="btn xs" data-act="estadoCita" data-id="${c.id}" data-estado="confirmada">Confirmar</button>`:''}${daysUntil(c.fecha)>=1?`<button class="btn xs ghost" data-act="estadoCita" data-id="${c.id}" data-estado="cancelada">Cancelar</button>`:''}</div></div>`).join('')||'<div class="empty">Sin citas próximas.</div>'}<button class="btn ghost" style="width:100%;justify-content:center;margin-top:14px" data-act="pwaReservar">Pedir una cita</button><p class="small faint" style="margin-top:8px">Cancelar solo hasta el día anterior. La reserva online completa está en el plan Pro de la clínica.</p></div>`;
    if(tab==='avisos') inner=`<div class="pw"><h1 style="font-size:24px">Avisos</h1>${nots.map(n=>`<div class="notif ${n.leida?'':'unread'}" data-act="pwaLeer" data-id="${n.id}"><b>${esc(by('pacientes',n.pacienteId)?.nombre)}</b><span>${esc(n.texto.replace(/ Responde BAJA.*$/,''))}</span><div class="small faint" style="margin-top:4px">${fmtDate(n.fecha)} ${fmtTime(n.fecha)}, por la app</div></div>`).join('')||'<div class="empty">Sin avisos. Cuando la clínica registre algo te llegará aquí sin costo.</div>'}</div>`;
    if(tab==='cuenta') inner=`<div class="pw"><h1 style="font-size:24px">Cuenta</h1><div class="kv" style="margin-top:12px"><b>Nombre</b><span>${esc(tut.nombre)}</span><b>Teléfono</b><span>${esc(tut.telefono)}</span><b>Clínica</b><span>${esc(t.nombre)}</span><b>Notificaciones</b><span>Por la app (activas)</span></div><label style="display:flex;gap:8px;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px"><input type="checkbox" ${tut.consentMarketing?'checked':''} data-act="consent" data-id="${tut.id}" data-origen="pwa"> Quiero recibir promociones de la clínica</label><p class="small faint" style="margin-top:8px">Los recordatorios de vacunas y citas llegan igual; esto solo controla lo comercial.</p><div class="tools" style="margin-top:16px;flex-direction:column"><button class="btn ghost" style="width:100%;justify-content:center" data-act="pwaExportar">Descargar mis datos</button><button class="btn ghost" style="width:100%;justify-content:center" data-act="pwaSalir">Cerrar sesión</button></div></div>`;
    screen=`<div class="pw" style="display:flex;justify-content:space-between;align-items:center;padding-top:8px"><span class="small muted">Atendido en <b style="color:var(--ink)">${esc(t.nombre)}</b></span>${unread?`<span class="tag honey">${unread} aviso${unread>1?'s':''}</span>`:''}</div>${inner}
    <nav class="tabbar">${[['mascotas','Mascotas','<path d="M4 12l8-8 8 8v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>'],['citas','Citas','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>'],['avisos','Avisos','<path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/>'],['cuenta','Cuenta','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>']].map(([k,l,svg])=>`<button class="${tab===k?'on':''}" data-act="pwaTab" data-tab="${k}"><svg viewBox="0 0 24 24">${svg}</svg>${l}</button>`).join('')}</nav>`;
  }
  return `<div class="pwa-wrap"><div class="phone"><div class="status"><span class="num">10:42</span><span>LTE</span></div><div class="screen">${screen}</div></div></div>`;
}

/* =========================== ACCIONES =========================== */

    const slug=nombre.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'').slice(0,20)||'clinica'; const id=uid('t');

    const u={id:uid('u'),tenantId:id,nombre:resp,correo,pass,rol:'admin',activo:true}; S.usuarios.push(u);

    audit(id,resp,'Espacio creado por autoservicio',`Plan Gratis. Acuerdo de tratamiento aceptado.`);
    S.session={...u}; S.mode='panel'; S.page='hoy'; toast(`Tu espacio ${slug}.app.vetsaas.pe está listo. Revisa tu correo para verificarlo.`); },
  login(){ const u=S.usuarios.find(x=>x.correo===fv('l_correo')&&x.pass===fv('l_pass')&&x.activo); if(!u) return toast('Correo o contraseña incorrectos.',true); S.session={...u}; S.mode='panel'; S.page='hoy'; audit(u.tenantId,u.nombre,'Inicio de sesión'); },
  buscar(d,el){ S.sub[d.key]=el.value; },

    if(T('citas').some(c=>c.vetId===vet&&c.fecha===fecha&&!['cancelada','no_asistio'].includes(c.estado))) return toast('Ese profesional ya tiene cita a esa hora.',true);
    S.citas.push({id:uid('ci'),tenantId:S.session.tenantId,pacienteId:fv('c_pac'),fecha,servicioId:fv('c_serv'),vetId:vet,estado:'reservada',motivo:fv('c_motivo')}); log('Cita creada',`${by('pacientes',fv('c_pac')).nombre} ${fmtDate(fecha)} ${fmtTime(fecha)}`); closeModal(); toast('Cita guardada. El recordatorio saldrá el día anterior.'); },
  estadoCita(d){ const c=by('citas',d.id); c.estado=d.estado; audit(c.tenantId,S.session?.nombre||'tutor (PWA)','Cita '+d.estado,by('pacientes',c.pacienteId).nombre); toast(`Cita: ${ESTADO_CITA[d.estado][0]}`); },

  nuevoPaciente(){ if(!T('tutores').length) return toast('Crea primero un tutor.',true); mNuevoPaciente(); return false; },
  guardarPaciente(){ if(!fv('p_nombre')) return toast('Falta el nombre.',true); const id=uid('p'); S.pacientes.push({id,tenantId:S.session.tenantId,tutorId:fv('p_tutor'),nombre:fv('p_nombre'),especie:fv('p_esp'),raza:fv('p_raza'),sexo:fv('p_sexo'),nacimiento:fv('p_nac'),estado:'activo',alergias:fv('p_alerg'),cronicas:'',microchip:''}); if(fv('p_peso')) S.pesos.push({id:uid('w'),pacienteId:id,fecha:new Date().toISOString(),kg:+fv('p_peso')}); log('Paciente creado',fv('p_nombre')); closeModal(); S.sub={fichaId:id,tab:'hce'}; toast('Paciente registrado.'); },
  nuevaConsulta(d){ mNuevaConsulta(d.id); return false; },
  guardarConsulta(d){ if(!fv('k_motivo')) return toast('Indica el motivo.',true); S.consultas.push({id:uid('c'),tenantId:S.session.tenantId,pacienteId:d.id,fecha:new Date().toISOString(),vet:S.session.nombre,motivo:fv('k_motivo'),anamnesis:fv('k_anam'),examen:fv('k_exam'),diagnostico:fv('k_dx'),plan:fv('k_plan'),cerrada:false}); if(fv('k_peso')) S.pesos.push({id:uid('w'),pacienteId:d.id,fecha:new Date().toISOString(),kg:+fv('k_peso')}); log('Consulta registrada',by('pacientes',d.id).nombre); closeModal(); toast('Consulta guardada como abierta. Ciérrala para que sea inmutable.'); },

    if(!lote) return toast('El lote es obligatorio para vacunas.',true);
    const p=by('pacientes',d.id), tut=by('tutores',p.tutorId);
    S.vacunaciones.push({id:uid('v'),tenantId:S.session.tenantId,pacienteId:d.id,tipo,fecha:new Date().toISOString(),lote,laboratorio:fv('v_lab'),veterinario:S.session.nombre,clinica:tenant().nombre,proximaDias:ESQUEMA[tipo]});

    closeModal(); toast(`${tipo} registrada. ${tut.vinculado?'El tutor recibió el aviso en su app.':'Tutor sin app: verá el cambio cuando se vincule.'}`); },

  nuevoTutor(){ mNuevoTutor(); return false; },
  guardarTutor(){ if(!fv('t_nombre')||!fv('t_tel')) return toast('Nombre y teléfono son obligatorios.',true); const c=fchk('t_consent'); S.tutores.push({id:uid('tu'),tenantId:S.session.tenantId,nombre:fv('t_nombre'),tipoDoc:fv('t_tipo'),doc:fv('t_doc'),telefono:fv('t_tel'),correo:fv('t_correo'),consentMarketing:c,consentFecha:c?new Date().toISOString():null,consentOrigen:c?'mostrador':null,consentUsuario:c?S.session.nombre:null,vinculado:false,pushToken:null,tokenQR:null}); log('Tutor creado',fv('t_nombre')+(c?' (consentimiento marketing)':'')); closeModal(); toast('Tutor registrado.'); },
  consent(d,el){ const t=by('tutores',d.id); t.consentMarketing=el.checked; t.consentFecha=el.checked?new Date().toISOString():null; t.consentOrigen=d.origen||'mostrador'; audit(t.tenantId,S.session?.nombre||'tutor (PWA)',el.checked?'Consentimiento marketing otorgado':'Consentimiento marketing retirado',`${t.nombre}, origen ${t.consentOrigen}`); toast(el.checked?'Consentimiento registrado con fecha y origen.':'Consentimiento retirado.'); },
  generarQR(d){ const t=by('tutores',d.id); t.tokenQR=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join(''); t.tokenExp=addDays(new Date().toISOString(),3); log('Token QR generado',t.nombre); mVerQR(t); return false; },
  verQR(d){ mVerQR(by('tutores',d.id)); return false; },
  cobrarPaciente(d){ const p=by('pacientes',d.id); S.page='caja'; S.sub={cart:[],cartTutor:p.tutorId}; },
  addServ(d,el){ if(!el.value) return; const s=by('servicios',el.value); S.sub.cart=S.sub.cart||[]; S.sub.cart.push({nombre:s.nombre,cant:1,precio:s.precio}); S.sub.cartTutor=fv('cj_tutor'); },
  addProd(d,el){ if(!el.value) return; const p=by('productos',el.value); S.sub.cart=S.sub.cart||[]; S.sub.cart.push({nombre:p.nombre,cant:1,precio:p.precioVenta,productoId:p.id}); S.sub.cartTutor=fv('cj_tutor'); },
  cartQty(d,el){ S.sub.cart[+d.ix].cant=Math.max(1,+el.value||1); S.sub.cartTutor=fv('cj_tutor'); },

    const item=S.sub.cart.find(i=>i.productoId&&stock(i.productoId)<i.cant); if(item) return toast(`Sin stock suficiente de ${item.nombre}.`,true);

  corregirCp(d){ const c=by('comprobantes',d.id); const tut=by('tutores',c.tutorId); modal('Corregir comprobante',`<p class="muted">${c.numero}: ${esc(c.motivo)}. Corrige el documento del tutor y reenvía.</p><div class="field" style="margin-top:12px"><label>DNI de ${esc(tut.nombre)}</label><input id="cx_doc" value="${esc(tut.doc)}"></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="reenviarCp" data-id="${c.id}">Reenviar a SUNAT</button>`); return false; },

  abrirCaja(){ S.cajas.push({id:uid('cj'),tenantId:S.session.tenantId,usuarioId:S.session.id,apertura:new Date().toISOString(),montoInicial:200,cierre:null,movimientos:[]}); log('Caja abierta','S/ 200'); },

  nuevoLote(){ mNuevoLote(); return false; },
  guardarLote(){ if(!fv('lt_lote')) return toast('Falta el lote.',true); S.lotes.push({id:uid('l'),tenantId:S.session.tenantId,productoId:fv('lt_prod'),lote:fv('lt_lote'),vence:new Date(fv('lt_vence')).toISOString(),cantidad:+fv('lt_cant')}); log('Lote ingresado',`${by('productos',fv('lt_prod')).nombre} ${fv('lt_lote')} x${fv('lt_cant')}`); closeModal(); toast('Lote ingresado.'); },
  nuevoProducto(){ mNuevoProducto(); return false; },
  guardarProducto(){ if(!fv('pd_nombre')) return toast('Falta el nombre.',true); S.productos.push({id:uid('pr'),tenantId:S.session.tenantId,nombre:fv('pd_nombre'),categoria:fv('pd_cat'),precioCompra:+fv('pd_pc'),precioVenta:+fv('pd_pv'),stockMin:+fv('pd_min'),controlado:fchk('pd_ctrl')}); log('Producto creado',fv('pd_nombre')); closeModal(); },
  nuevoIngreso(){ modal('Nuevo ingreso',`<div class="field"><label>Paciente</label><select id="h_pac">${T('pacientes').map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Motivo</label><input id="h_motivo"></div><div class="field"><label>Jaula</label><select id="h_jaula">${(S.jaulasTenant[S.session.tenantId]||[]).filter(j=>!T('internamientos').some(h=>!h.alta&&h.jaula===j)).map(j=>`<option>${j}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Diagnóstico</label><input id="h_dx"></div><div class="field"><label>Presupuesto S/</label><input id="h_pres" type="number" value="300"></div><div class="field"><label>Anticipo S/</label><input id="h_ant" type="number" value="0"></div></div><div class="field"><label>Veterinario responsable</label><select id="h_vet">${T('usuarios').filter(u=>u.activo).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarIngreso">Ingresar</button>`); return false; },
  guardarIngreso(){ if(!fv('h_jaula')) return toast('No hay jaulas libres.',true); const hid=uid('h'); S.internamientos.push({id:hid,tenantId:S.session.tenantId,pacienteId:fv('h_pac'),ingreso:new Date().toISOString(),motivo:fv('h_motivo'),diagnostico:fv('h_dx'),jaula:fv('h_jaula'),vetId:fv('h_vet'),presupuesto:+fv('h_pres')||0,anticipo:+fv('h_ant')||0,tareas:[],signos:[],evolucion:[],consumos:[],alta:null,informeAlta:''}); const pp=by('pacientes',fv('h_pac')), tt=by('tutores',pp.tutorId); if(tt.vinculado){ S.notificaciones.unshift({id:uid('n'),tenantId:S.session.tenantId,tutorId:tt.id,pacienteId:pp.id,evento:'hospitalizacion',fecha:new Date().toISOString(),canal:'push',estado:'entregado',costo:0,leida:false,texto:`${pp.nombre} quedó hospitalizado en ${tenant().nombre}. Te iremos avisando por aquí.`}); tenant().pushEnviados++; } S.sub.hospId=hid; log('Ingreso hospitalario',by('pacientes',fv('h_pac')).nombre); closeModal(); },
  agregarTarea(d){ modal('Agregar tarea',`<div class="row"><div class="field"><label>Hora</label><input id="ta_hora" type="time" value="12:00"></div><div class="field"><label>Tarea</label><input id="ta_desc"></div></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarTarea" data-h="${d.h}">Agregar</button>`); return false; },
  guardarTarea(d){ by('internamientos',d.h).tareas.push({hora:fv('ta_hora'),desc:fv('ta_desc'),hecha:false}); closeModal(); },
  tareaHecha(d){ const h=by('internamientos',d.h); const t=h.tareas.find(x=>x.hora===d.hora); t.hecha=true; t.hechaPor=S.session.nombre; log('Tarea hospitalaria hecha',`${by('pacientes',h.pacienteId).nombre} ${d.hora} ${t.desc}`); },
  darAlta(d){ const h=by('internamientos',d.h); h.alta=new Date().toISOString(); h.informeAlta=fv('al_informe')||''; const p=by('pacientes',h.pacienteId), tut=by('tutores',p.tutorId); const total=h.consumos.reduce((a,c)=>a+c.cant*c.precio,0);
    if(tut.vinculado){ S.notificaciones.unshift({id:uid('n'),tenantId:h.tenantId,tutorId:tut.id,pacienteId:p.id,evento:'alta',fecha:h.alta,canal:'push',estado:'entregado',costo:0,leida:false,texto:`${p.nombre} ya tiene el alta. ${h.informeAlta||'Puedes pasar a recogerlo.'}`}); tenant().pushEnviados++; }
    S.sub={cart:h.consumos.map(c=>({nombre:c.nombre,cant:c.cant,precio:c.precio})),cartTutor:tut.id}; if(h.anticipo) S.sub.cart.push({nombre:'Anticipo recibido',cant:1,precio:-h.anticipo});
    log('Alta hospitalaria',`${p.nombre}, cuenta ${fmtMoney(total)}`); closeModal(); S.sub.hospId=null; toast(`${p.nombre} dado de alta. Cuenta lista en Caja.`); },
  scheduler(){ const r=generarRecordatorios(); toast(r.creados?`${r.creados} recordatorios generados.${r.omitidos.length?' Sin canal para: '+r.omitidos.join(', '):''}`:'Nada nuevo que enviar hoy (ya se enviaron o no hay eventos).'); },
  evToggle(d,el){ S.eventosTenant[S.session.tenantId][d.ev].activo=el.checked; log('Evento de mensajería',`${d.ev} ${el.checked?'activado':'desactivado'}`); },
  evDias(d,el){ S.eventosTenant[S.session.tenantId][d.ev].dias=el.value.split(',').map(x=>+x.trim()).filter(x=>!isNaN(x)); return false; },
  plantilla(d,el){ let v=el.value; if(!/Responde BAJA/i.test(v)) v=v.trim()+' Responde BAJA para no recibir más.'; S.plantillasTenant[S.session.tenantId][d.ev]=v; log('Plantilla editada',d.ev); return false; },
  campana(){ toast('Campañas: solo a tutores con consentimiento. (Pantalla no incluida en este prototipo.)'); return false; },
  guardarConfig(){ const t=tenant(); Object.assign(t,{nombre:fv('cf_nombre'),ruc:fv('cf_ruc'),direccion:fv('cf_dir'),telefono:fv('cf_tel')}); log('Configuración guardada'); toast('Guardado.'); },
  verificar(){ tenant().correoVerificado=true; log('Correo verificado'); toast('Correo verificado.'); },
  cargarCert(){ if(!/^\d{11}$/.test(tenant().ruc||'')) return toast('Primero registra un RUC válido.',true); tenant().certificadoSunat=true; log('Certificado SUNAT cargado','Cifrado en reposo (simulado)'); toast('Certificado cargado y cifrado.'); },
  toggleUsuario(d){ const u=by('usuarios',d.id); if(!u.activo&&usuariosActivos()>=plan().usuarios) return toast('Límite de usuarios del plan alcanzado.',true); u.activo=!u.activo; log(u.activo?'Usuario activado':'Usuario desactivado',u.nombre); },
  nuevoUsuario(){ modal('Invitar usuario',`<div class="row"><div class="field"><label>Nombre</label><input id="nu_nombre"></div><div class="field"><label>Correo</label><input id="nu_correo"></div></div><div class="row"><div class="field"><label>Rol</label><select id="nu_rol"><option value="veterinario">Veterinario</option><option value="recepcion">Recepción</option><option value="auxiliar">Auxiliar</option><option value="admin">Admin</option></select></div><div class="field"><label>Colegiatura</label><input id="nu_col"></div></div><p class="small faint">Recibirá un enlace de invitación de un solo uso.</p>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarUsuario">Invitar</button>`); return false; },
  guardarUsuario(){ if(usuariosActivos()>=plan().usuarios) return toast('Límite del plan.',true); S.usuarios.push({id:uid('u'),tenantId:S.session.tenantId,nombre:fv('nu_nombre'),correo:fv('nu_correo'),pass:'invitado',rol:fv('nu_rol'),colegiatura:fv('nu_col'),activo:true}); log('Usuario invitado',fv('nu_correo')); closeModal(); },
  nuevoServicio(){ modal('Nuevo servicio',`<div class="row"><div class="field"><label>Nombre</label><input id="sv_nombre"></div><div class="field"><label>Precio</label><input id="sv_precio" type="number"></div><div class="field"><label>Minutos</label><input id="sv_dur" type="number" value="30"></div></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarServicio">Guardar</button>`); return false; },
  guardarServicio(){ S.servicios.push({id:uid('s'),tenantId:S.session.tenantId,nombre:fv('sv_nombre'),precio:+fv('sv_precio'),dur:+fv('sv_dur')}); log('Servicio creado',fv('sv_nombre')); closeModal(); },
  cambiarPlan(d){ mCambiarPlan(d.plan); return false; },
  confirmarPlan(d){ const t=tenant(), np=PLANS[d.plan], subir=np.precio>plan().precio; if(subir&&!t.tarjeta){ const c=fv('pl_card').replace(/\s/g,''); if(!/^\d{16}$/.test(c)) return toast('Tarjeta inválida (16 dígitos).',true); t.tarjeta=c.slice(-4); }
    const ant=t.plan; t.plan=d.plan; if(!subir&&!np.modulos.includes(S.page)) S.page='miplan'; log(subir?'Plan mejorado':'Plan reducido',`${PLANS[ant].nombre} → ${np.nombre}`); closeModal(); toast(subir?`Plan ${np.nombre} activo. Módulos desbloqueados.`:`Cambio a ${np.nombre} programado.`); },
  closeModal(){ closeModal(); return false; },

  // Hospitalización
  hospSel(d){ S.sub.hospId=d.id; },
  nuevaJaula(){ const j=prompt('Nombre de la jaula/área (ej. J-5, G-3):'); if(j){ S.jaulasTenant[S.session.tenantId].push(j); log('Jaula agregada',j);} },
  hospSignos(d){ modal('Signos vitales',`<div class="row"><div class="field"><label>Temperatura (°C)</label><input id="sv_temp" type="number" step="0.1" value="38.5"></div><div class="field"><label>FC (lpm)</label><input id="sv_fc" type="number" value="120"></div></div><div class="row"><div class="field"><label>FR (rpm)</label><input id="sv_fr" type="number" value="24"></div><div class="field"><label>Dolor (0-10)</label><input id="sv_dolor" type="number" min="0" max="10" value="2"></div></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarSignos" data-h="${d.h}">Guardar</button>`); return false; },
  guardarSignos(d){ const h=by('internamientos',d.h); h.signos.push({fecha:new Date().toISOString(),temp:+fv('sv_temp'),fc:+fv('sv_fc'),fr:+fv('sv_fr'),dolor:+fv('sv_dolor')}); log('Signos vitales',`${by('pacientes',h.pacienteId).nombre} T ${fv('sv_temp')}`); closeModal(); },
  hospNota(d){ modal('Nota de evolución',`<div class="field"><label>Nota</label><textarea id="ev_texto"></textarea></div><div class="field"><label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" id="ev_push" checked style="width:auto"> Enviar actualización al tutor por la app (gratis)</label></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarNota" data-h="${d.h}">Guardar</button>`); return false; },
  guardarNota(d){ const h=by('internamientos',d.h), p=by('pacientes',h.pacienteId), tu=by('tutores',p.tutorId); const texto=fv('ev_texto'); if(!texto) return toast('Escribe la nota.',true); const e={fecha:new Date().toISOString(),autor:S.session.nombre,texto,enviadoTutor:false};
    if(fchk('ev_push')&&tu.vinculado){ S.notificaciones.unshift({id:uid('n'),tenantId:h.tenantId,tutorId:tu.id,pacienteId:p.id,evento:'hospitalizacion',fecha:e.fecha,canal:'push',estado:'entregado',costo:0,leida:false,texto:`Novedades de ${p.nombre}: ${texto}`}); tenant().pushEnviados++; e.enviadoTutor=true; }
    h.evolucion.push(e); log('Nota de evolución',p.nombre); closeModal(); toast(e.enviadoTutor?'Nota guardada y enviada al tutor.':'Nota guardada.'); },
  hospConsumo(d){ modal('Registrar consumo',`<div class="field"><label>Producto (descuenta stock)</label><select id="cs_prod"><option value="">Servicio manual</option>${T('productos').map(p=>`<option value="${p.id}">${esc(p.nombre)} ${fmtMoney(p.precioVenta)} (stock ${stock(p.id)})</option>`).join('')}</select></div><div class="row"><div class="field"><label>Descripción (si es manual)</label><input id="cs_nombre" placeholder="Día de hospitalización"></div><div class="field"><label>Cantidad</label><input id="cs_cant" type="number" value="1"></div><div class="field"><label>Precio</label><input id="cs_precio" type="number" step="0.1" value="60"></div></div>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="guardarConsumo" data-h="${d.h}">Registrar</button>`); return false; },
  guardarConsumo(d){ const h=by('internamientos',d.h); const pid=fv('cs_prod'); const cant=+fv('cs_cant')||1; let item; if(pid){ const p=by('productos',pid); if(stock(pid)<cant) return toast('Sin stock suficiente.',true); descontarStock(pid,cant); item={nombre:p.nombre,cant,precio:p.precioVenta,productoId:pid}; } else { if(!fv('cs_nombre')) return toast('Describe el consumo.',true); item={nombre:fv('cs_nombre'),cant,precio:+fv('cs_precio')}; } h.consumos.push(item); log('Consumo hospitalario',`${by('pacientes',h.pacienteId).nombre}: ${item.nombre} ×${cant}`); closeModal(); },
  hospAlta(d){ const h=by('internamientos',d.h), p=by('pacientes',h.pacienteId); const consumo=h.consumos.reduce((a,c)=>a+c.cant*c.precio,0); modal('Dar de alta a '+esc(p.nombre),`<div class="field"><label>Informe e indicaciones para el tutor</label><textarea id="al_informe" placeholder="Reposo 7 días, antibiótico cada 12 h, control el…"></textarea></div><div class="tot"><span>Consumos</span><b class="num">${fmtMoney(consumo)}</b></div><div class="tot"><span>Anticipo</span><b class="num">-${fmtMoney(h.anticipo||0)}</b></div><div class="tot big"><span>Por cobrar</span><b class="num">${fmtMoney(Math.max(0,consumo-(h.anticipo||0)))}</b></div><p class="small faint" style="margin-top:8px">Al confirmar se libera la jaula, se envía el informe al tutor y los consumos pasan a Caja para el comprobante.</p>`,`<button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn" data-act="darAlta" data-h="${d.h}">Confirmar alta</button>`); return false; },
  // PWA fotos
  pwaFoto(d,el){ const f=el.files&&el.files[0]; if(!f) return false; if(!f.type.startsWith('image/')) { toast('Solo imágenes.',true); return false; } if(f.size>8*1024*1024){ toast('Máximo 8 MB.',true); return false; }
    const p=by('pacientes',d.id); const tut=by('tutores',p.tutorId); if(S.pwa.tutorId!==tut.id){ toast('No tienes acceso a esta mascota.',true); return false; }
    const img=new Image(); const url=URL.createObjectURL(f); img.onload=()=>{ const max=800, r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); const data=c.toDataURL('image/jpeg',.82); URL.revokeObjectURL(url); (p.fotos=p.fotos||[]).unshift(data); audit(p.tenantId,'tutor (PWA)','Foto subida',`${p.nombre} (${Math.round(data.length*0.75/1024)} KB)`); render(); toast('Foto guardada.'); }; img.onerror=()=>toast('No se pudo leer la imagen.',true); img.src=url; return false; },
  pwaFotoPrincipal(d){ const p=by('pacientes',S.pwa.pacienteId); const i=+d.i; if(i>0){ const [f]=p.fotos.splice(i,1); p.fotos.unshift(f); toast('Foto principal actualizada.'); } },
  // PWA
  pwaEntrar(d){ S.pwa.tutorId=d.id; S.pwa.tab='mascotas'; },
  pwaVincular(){ const tok=fv('pw_token'); const t=S.tutores.find(x=>x.tokenQR===tok); if(!t) return toast('Token inválido o ya usado.',true); if(new Date(t.tokenExp)<new Date()) return toast('Token vencido. Pide uno nuevo en la clínica.',true); t.vinculado=true; t.pushToken='fcm_'+tok.slice(0,6); t.tokenQR=null; audit(t.tenantId,'tutor (PWA)','Vinculación por QR',t.nombre); S.pwa.tutorId=t.id; S.pwa.tab='mascotas'; toast(`Listo, ${t.nombre}. Tus mascotas ya están aquí y los avisos llegarán por la app.`); },
  pwaPet(d){ S.pwa.pacienteId=d.id; }, pwaTab(d){ S.pwa.tab=d.tab; },
  pwaLeer(d){ by('notificaciones',d.id).leida=true; },
  pwaReservar(d){ const tut=by('tutores',S.pwa.tutorId), t=S.tenants.find(x=>x.id===tut.tenantId); if(PLANS[t.plan].modulos.includes('hospitalizacion')){ const p=by('pacientes',S.pwa.pacienteId); S.citas.push({id:uid('ci'),tenantId:t.id,pacienteId:p.id,fecha:addDays(D(2,10),0),servicioId:S.servicios.find(s=>s.tenantId===t.id)?.id,vetId:S.usuarios.find(u=>u.tenantId===t.id)?.id,estado:'reservada',motivo:d.tipo||'Reserva online'}); audit(t.id,'tutor (PWA)','Reserva online',p.nombre); S.pwa.tab='citas'; toast('Cita reservada. La clínica la verá en su agenda.'); } else toast(`${t.nombre} no tiene reserva online (plan ${PLANS[t.plan].nombre}). Llámalos al ${t.telefono}.`,true); },
  pwaCompartir(){ toast('Enlace público de solo lectura generado (sin datos del tutor). Revocable desde Cuenta.'); },
  pwaPDF(){ toast('PDF del carnet generado con fecha de hoy y QR de verificación.'); },
  pwaExportar(){ toast('Exportación de tus datos solicitada (derecho ARCO). Llegará a tu correo.'); },
  pwaSalir(){ S.pwa.tutorId=null; },
};

/* =========================== RENDER Y EVENTOS =========================== */
function render(){
  const root=document.getElementById('root');
  document.querySelectorAll('.modebar button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  if(S.mode==='panel'&&!S.session){ S.mode='pub'; S.route='login'; }
  if(S.mode==='pub') root.innerHTML = S.route==='registro'?vRegistro():S.route==='login'?vLogin():vLanding();
  else if(S.mode==='panel') root.innerHTML = vPanel();
  else root.innerHTML = vPWA();
}
document.querySelector('.modebar').addEventListener('click',e=>{ const b=e.target.closest('button[data-mode]'); if(!b) return; const m=b.dataset.mode; if(m==='panel'&&!S.session){ S.mode='pub'; S.route='login'; toast('Inicia sesión para entrar al panel (demo: carla@lossauces.pe / demo1234).'); } else S.mode=m; if(m==='pub'&&S.session) S.route='landing'; render(); });
document.body.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.matches('input,select,textarea')) return; e.preventDefault(); const fn=A[el.dataset.act]; if(!fn) return; const r=fn(el.dataset,el); if(r!==false) render(); });
document.body.addEventListener('change',e=>{ const el=e.target.closest('input[data-act],select[data-act],textarea[data-act]'); if(!el) return; const fn=A[el.dataset.act]; if(!fn) return; const r=fn(el.dataset,el); if(r!==false) render(); });
document.body.addEventListener('input',e=>{ const el=e.target; if(el.matches('.search[data-act="buscar"]')){ A.buscar(el.dataset,el); const pos=el.selectionStart; render(); const n=document.querySelector('.search'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} } });
document.body.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('dlg').open){ const b=document.querySelector('#dlg .df .btn:not(.ghost)'); if(b&&!e.target.matches('textarea')){ e.preventDefault(); b.click(); } } });

seed(); render();
Object.assign(window,{S,PLANS,ESQUEMA,ANIM_MEDIA,estadoMascota,petSVG,mascotaAnim}); // para depurar en consola
</script>
